# Every push and pull request: the scripts through shellcheck, then ./test (gcc, clang, gcc with ASan and UBSan)
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -S warning build run test
      - run: ./test
